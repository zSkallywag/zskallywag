<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" font-family="'Courier New', Courier, 'Liberation Mono', monospace">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.35"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C4B5FD" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="q"><rect x="326.4" y="40" height="40" width="0">
      <animate attributeName="width" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="0.0;14.4;28.8;43.2;57.6;72.0;86.4;100.8;115.2;129.6;144.0;158.4;172.8;187.2;201.6;216.0;230.4;244.8;259.2;273.6;288.0;302.4;316.8;331.2;345.6;360.0;374.4;388.8;403.2;417.6;432.0;446.4;460.8;475.2;489.6;504.0;518.4;532.8;547.2" keyTimes="0.0000;0.0725;0.0783;0.0842;0.0900;0.0958;0.1017;0.1075;0.1133;0.1192;0.1250;0.1308;0.1367;0.1425;0.1483;0.1542;0.1600;0.1658;0.1717;0.1775;0.1833;0.1892;0.1950;0.2008;0.2067;0.2125;0.2183;0.2242;0.2300;0.2358;0.2417;0.2475;0.2533;0.2592;0.2650;0.2708;0.2767;0.2825;0.2883"/>
