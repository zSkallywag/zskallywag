  <line x1="300.0" y1="108" x2="900.0" y2="108" stroke="url(#edge)" opacity="0.6"/>
  <g font-size="12" letter-spacing="4" text-anchor="middle">
    <text x="600.0" y="136" fill="#8B8BA7">— END OF TRANSMISSION —</text>
    <text x="600.0" y="156" fill="#8B5CF6">STAY PATCHED ▸ STAY VIGILANT<animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/></text>
  </g>
  
  <rect width="1200" height="170" fill="url(#scan)" pointer-events="none"/>
  <rect x="0" y="-120" width="1200" height="120" fill="url(#band)">
    <animate attributeName="y" values="-120;170" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="170" fill="url(#vignette)" pointer-events="none"/>
