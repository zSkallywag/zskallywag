      <stop offset="0" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style></style>

  <rect width="1200" height="170" fill="#05040A"/>
  <ellipse cx="600.0" cy="70" rx="420" ry="80" fill="url(#fg)"/>
  <text x="326.4" y="70" font-size="24" fill="#F5F3FF" font-style="italic" clip-path="url(#q)" filter="url(#glow)" xml:space="preserve">Security is an engineering discipline.</text>
  <rect y="50" width="14.4" height="26" fill="#60A5FA">
    <animate attributeName="x" calcMode="discrete" dur="12.0s" repeatCount="indefinite" values="326.4;340.8;355.2;369.6;384.0;398.4;412.8;427.2;441.6;456.0;470.4;484.8;499.2;513.6;528.0;542.4;556.8;571.2;585.6;600.0;614.4;628.8;643.2;657.6;672.0;686.4;700.8;715.2;729.6;744.0;758.4;772.8;787.2;801.6;816.0;830.4;844.8;859.2;873.6" keyTimes="0.0000;0.0725;0.0783;0.0842;0.0900;0.0958;0.1017;0.1075;0.1133;0.1192;0.1250;0.1308;0.1367;0.1425;0.1483;0.1542;0.1600;0.1658;0.1717;0.1775;0.1833;0.1892;0.1950;0.2008;0.2067;0.2125;0.2183;0.2242;0.2300;0.2358;0.2417;0.2475;0.2533;0.2592;0.2650;0.2708;0.2767;0.2825;0.2883"/>
