<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 34" width="1200" height="34" font-family="'Courier New', Courier, 'Liberation Mono', monospace">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.35"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C4B5FD" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="haz" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#05040A"/>
      <rect width="9.0" height="18" fill="#A855F7"/>
    </pattern>
  </defs>
  <style></style>

  
  <clipPath id="hb75810797"><rect x="0" y="6" width="1200" height="22"/></clipPath>
  <g clip-path="url(#hb75810797)" opacity="1"><g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="25.46 0" dur="2s" repeatCount="indefinite"/>
    <rect x="-60" y="6" width="1320" height="22" fill="url(#haz)"/>
  </g></g>
  <rect x="0" y="6" width="1200" height="22" fill="#000" opacity="0.15"/>
  <g font-size="12" letter-spacing="3" font-weight="bold">
    <rect x="450.0" y="4" width="300" height="26" fill="#05040A" stroke="#A855F7" stroke-width="1.5"/>
    <text x="600.0" y="22" fill="#F5F3FF" text-anchor="middle">⚠ RESTRICTED ZONE ⚠<animate attributeName="fill" values="#F5F3FF;#C4B5FD;#F5F3FF" dur="2s" repeatCount="indefinite"/></text>
  </g>
</svg>
